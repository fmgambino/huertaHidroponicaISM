[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_USE_LONG_LONG=1
